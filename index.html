<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1e3c72">
  <meta name="description" content="Railway Attendance — Eastern Railway, Howrah">
  <title>Railway Attendance</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='20' font-size='20'%3E%F0%9F%9A%86%3C/text%3E%3C/svg%3E">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      min-height: 100dvh;
    }

    .card {
      max-width: 460px;
      width: 100%;
      text-align: center;
      padding: 40px 32px 34px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .train-icon {
      font-size: 3.6rem;
      line-height: 1;
      margin-bottom: 18px;
      display: inline-block;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.88rem;
      opacity: 0.75;
      margin-bottom: 30px;
      letter-spacing: 0.3px;
    }

    .enter-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px 24px;
      background: #ffffff;
      color: #1e3c72;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      font-family: inherit;
    }

    .enter-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
    }

    .enter-btn:active {
      transform: translateY(0);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
    }

    .enter-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .note {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 0.78rem;
      opacity: 0.65;
      line-height: 1.6;
    }

    .note strong {
      color: #ffffff;
      opacity: 0.9;
      font-weight: 600;
    }

    .note code {
      display: inline-block;
      background: rgba(255, 255, 255, 0.08);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-family: 'Courier New', monospace;
    }

    .progress {
      margin-top: 26px;
      height: 3px;
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .progress.visible {
      opacity: 1;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: #ffffff;
      border-radius: 2px;
      animation: progressFill 1.2s ease-out forwards;
    }

    @keyframes progressFill {
      to { width: 100%; }
    }

    .countdown {
      margin-top: 12px;
      font-size: 0.8rem;
      opacity: 0.7;
      min-height: 1.2em;
    }

    /* Safe area for notched devices */
    @supports (padding: max(0px)) {
      body {
        padding-top: max(24px, env(safe-area-inset-top, 24px));
        padding-bottom: max(24px, env(safe-area-inset-bottom, 24px));
      }
    }

    @media (max-width: 480px) {
      .card { padding: 32px 22px 26px; border-radius: 20px; }
      h1 { font-size: 1.3rem; }
      .train-icon { font-size: 3rem; }
      .enter-btn { font-size: 0.95rem; padding: 14px 20px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="train-icon">🚆</div>
    <h1>Railway Attendance</h1>
    <p class="subtitle">Eastern Railway · Howrah Division</p>

    <a class="enter-btn" id="enterBtn" href="#" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14M13 5l7 7-7 7"/>
      </svg>
      <span>Enter Application</span>
    </a>

    <div class="progress" id="progress">
      <div class="progress-bar"></div>
    </div>
    <div class="countdown" id="countdown"></div>

    <div class="note">
      You will be redirected to <code>script.google.com</code> where sign-in is
      handled by Google. Use your <strong>attendance account email and password</strong>
      on the login screen.
    </div>
  </main>

  <script>
    (function () {
      var APP_URL = 'https://script.google.com/macros/s/AKfycbwWArCEHizKos9V1y1TfRFhomKBqnUIaGy7noul6o5YmhJGJzDEWcRpoZ5xbvhl6b5G6A/exec';
      var AUTO_REDIRECT_DELAY = 4; // seconds

      var enterBtn = document.getElementById('enterBtn');
      var progress = document.getElementById('progress');
      var countdown = document.getElementById('countdown');

      enterBtn.href = APP_URL;

      var remaining = AUTO_REDIRECT_DELAY;
      progress.classList.add('visible');
      countdown.textContent = 'Opening in ' + remaining + 's…';

      var timer = setInterval(function () {
        remaining--;
        if (remaining <= 0) {
          clearInterval(timer);
          countdown.textContent = 'Opening now…';
          navigate();
        } else {
          countdown.textContent = 'Opening in ' + remaining + 's…';
        }
      }, 1000);

      function navigate() {
        // Use location.href so the redirect replaces this page in the
        // browser history — the user lands on the app itself, not on the
        // landing page they have to click again to dismiss.
        window.location.href = APP_URL;
      }

      // Clicking the button navigates immediately and cancels the timer.
      enterBtn.addEventListener('click', function (e) {
        e.preventDefault();
        clearInterval(timer);
        countdown.textContent = 'Opening…';
        navigate();
      });
    })();
  </script>
</body>
</html>
